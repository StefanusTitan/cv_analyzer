[project]
name = "cv-analyzer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "office-oxide>=0.1.8",
    "dashscope>=1.26.5",
    "pdf-oxide>=0.3.0",
    "loguru>=0.7.0",
    "uvicorn[standard]>=0.30.0",
    "playwright>=1.61.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false
default-groups = "all"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
